# Generated by scripts/build.py from each container's setup.yaml. Do not edit.
# The ansible stacks role reads this file to work out a host's stacks, and
# nixos-sync.yml carries the folders, files and firewall ports to the host's
# NixOS configuration. See scripts/project-layout.md.
project: "traefik"
containers: ["error-pages", "logrotate", "socket-proxy", "traefik", "traefik-kop"]
needs_host: []
needs_fleet: ["kop-redis"]
provides:
  - name: "traefik"
    reach: "host"
folders:
  - root: "logs"
    path: "traefik"
    owner: 101000
    group: 101000
    mode: "0755"
  - root: "volumes"
    path: "traefik-certs"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "traefik-plugins"
    owner: 101000
    group: 101000
files: []
firewall:
  - port: 80
    proto: "tcp"
    allow_from: "any"
    comment: "Traefik HTTP"
  - port: 443
    proto: "tcp"
    allow_from: "any"
    comment: "Traefik HTTPS"
  - port: 8443
    proto: "tcp"
    allow_from: "any"
    comment: "Traefik HTTPS (alt)"
