###############################################################################
# Start of stack config
###############################################################################
# Project Name: "victoriametrics"
name: ${PROJECT_NAME}

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
  frontend:
    name: ${PROJECT_NAME}_frontend
    internal: false
  backend:
    name: ${PROJECT_NAME}_backend
    internal: true
  socket_proxy:
    name: ${PROJECT_NAME}_socket_proxy
    internal: true

include:
  - ../victoriametrics-agent/compose.yaml

services:

  victoriametrics:
    extends:
      file: ../../containers/victoriametrics/compose.yaml
      service: .victoriametrics

  victorialogs:
    extends:
      file: ../../containers/victorialogs/compose.yaml
      service: .victorialogs

  victoriatraces:
    extends:
      file: ../../containers/victoriatraces/compose.yaml
      service: .victoriatraces

  vmauth:
    extends:
      file: ../../containers/vmauth/compose.yaml
      service: .vmauth

  vmalert:
    extends:
      file: ../../containers/vmalert/compose.yaml
      service: .vmalert

  grafana:
    extends:
      file: ../../containers/grafana/compose.yaml
      service: .grafana

  alertmanager:
    extends:
      file: ../../containers/alertmanager/compose.yaml
      service: .alertmanager
