project: "victoriametrics"
containers: ["cadvisor", "socket-proxy", "vector", "vlagent", "vmagent"]
needs_host: []
needs_fleet: ["vmauth"]
provides: []
folders:
  - root: "volumes"
    path: "vlagent-data"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "vmagent-data"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "vector-data"
    owner: 101000
    group: 101000
files: []
firewall:
  - port: 5140
    proto: "tcp"
    allow_from: "internal"
    comment: "Vector syslog"
  - port: 5140
    proto: "udp"
    allow_from: "internal"
    comment: "Vector syslog"
