###############################################################################
#region Default configs
###############################################################################

  #####################################
  # Container base defaults
  #####################################
  # Max Usage Limits
x-limits: &limits
  mem_limit: ${MEM_LIMIT:-2G} # Override per container if necessary
  memswap_limit: ${MEM_SWAP_LIMIT:-2.5G}
  mem_reservation: ${MEM_RESERVATION:-64M}
  pids_limit: ${PIDS_LIMIT:-200}
  cpus: ${CPUS_LIMIT:-2} # Set below the total number of cores, for example 3.5 for 4 cores

  # Restart Settings
x-restart: &restart
  stop_grace_period: ${RESTART_GRACE:-1m}
  restart: ${RESTART_MODE:-unless-stopped}

  # Configure security
x-security: &security
  security_opt:
    - no-new-privileges=${NO_NEW_PRIVILEGES:-true}

  # Configure User
x-user: &user
  user: ${PUID:-1000}:${PGID:-1000}

  # Configure Logging
x-logging: &logging
  logging:
    options:
      max-size: ${LOG_MAX_SIZE:-10m}
      max-file: ${LOG_MAX_FILE:-3}

  ## All base defaults in one
x-base: &default-base
  <<: [*limits, *restart, *security, *user, *logging]

  #####################################
  # Container healthcheck defaults
  #####################################
x-healthcheck: &default_healthcheck
  interval: ${HEALTH_INTERVAL:-60s}
  timeout: ${HEALTH_TIMEOUT:-10s}
  retries: ${HEALTH_RETRIES:-5}
  start_period: ${HEALTH_START:-10s}

  #####################################
  # Container environment defaults
  #####################################
x-environment-tz: &environment_tz
  TZ: ${TZ:-America/Chicago}

x-environment-user: &environment_user
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}

  ## All environment defaults in one
x-environment: &default_environment
  <<: [*environment_tz, *environment_user]

#endregion
###############################################################################
#region Stack config
###############################################################################

services:

  .vmagent:
    <<: [*limits, *restart, *security, *user, *logging]
    image: victoriametrics/vmagent:v1.133.0
    hostname: ${PROJECT_NAME}-${VMAGENT_HOSTNAME}.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}
    container_name: "${PROJECT_NAME}-${VMAGENT_HOSTNAME}"
    command:
      - "--loggerFormat=json"
      - "--promscrape.config=/etc/prometheus/prometheus.yml"
      - "--remoteWrite.tmpDataPath=/vmagent"
      - '--remoteWrite.maxDiskUsagePerURL=100MB'
      - "--remoteWrite.basicAuth.username=${VMAUTH_USER}"
      - "--remoteWrite.basicAuth.password=${VMAUTH_PASS}"
      - "--remoteWrite.url=https://${VMAUTH_HOST}/api/v1/write"
    #ports:
    #  - 8429:8429
    environment:
      <<: [*environment_tz, *environment_user]
      SERVER_ADDRESS: ${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}
      PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - ${DOCKER_VOLUMES}/${PROJECT_NAME}/vmagent-data:/vmagent
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8429/health"]
      <<: *default_healthcheck

  .vmagent-traefik:
    extends: .vmagent
    volumes:
      - ./config/prometheus-traefik.yml:/etc/prometheus/prometheus.yml:ro

  .vmagent-host:
    extends: .vmagent
    hostname: ${VMAGENT_HOSTNAME}.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}
    environment:
      NODE_EXPORTER_USER: ${NODE_EXPORTER_USER}
    volumes:
      - ./config/prometheus-host.yml:/etc/prometheus/prometheus.yml:ro
      - /etc/node-exporter/node_exporter.crt:/etc/prometheus/node_exporter.crt:ro
      # The password is generated per host by ansible and read from disk, so it
      # is never an environment variable and never reaches Komodo. Both files are
      # written by roles/monitoring/tasks/node-exporter.yml.
      - /etc/node-exporter/scrape-password:/etc/prometheus/node_exporter_password:ro

  ## Scrapes everything on one VM: this stack's own agents and Traefik, plus the
  ## host's node_exporter and cadvisor. Used by system-agent, the per-VM bundle.
  .vmagent-system:
    extends: .vmagent
    environment:
      NODE_EXPORTER_USER: ${NODE_EXPORTER_USER}
    volumes:
      - ./config/prometheus-system.yml:/etc/prometheus/prometheus.yml:ro
      - /etc/node-exporter/node_exporter.crt:/etc/prometheus/node_exporter.crt:ro
      - /etc/node-exporter/scrape-password:/etc/prometheus/node_exporter_password:ro
