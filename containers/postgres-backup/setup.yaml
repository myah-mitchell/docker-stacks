# Host setup for postgres-backup. scripts/build.py renders it into each stack README, and
# nixos-sync.yml carries it to the host's NixOS configuration. See
# scripts/project-layout.md.
needs_stack:
  # Dumps the postgres beside it in its own stack, never a shared one,
  # so this always cancels where it is used.
  - name: postgres
folders:
  - path: postgres-backup-data
    owner: 100000
    group: 100000
