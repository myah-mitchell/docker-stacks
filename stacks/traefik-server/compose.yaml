###############################################################################
# Start of stack config
###############################################################################
# Project Name
name: ${PROJECT_NAME}

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
  frontend:
    name: ${PROJECT_NAME}_frontend
    internal: false
  backend:
    name: ${PROJECT_NAME}_backend
    internal: true
  socket_proxy:
    name: ${PROJECT_NAME}_socket_proxy
    internal: true

include:
  - ../traefik-agent/compose.yaml

services:

  redis:
    extends:
      file: ../../containers/redis/compose.yaml
      service: .redis-public

