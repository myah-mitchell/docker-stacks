# Host setup for blackbox-exporter. scripts/build.py renders it into each stack README, and
# nixos-sync.yml carries it to the host's NixOS configuration. See
# scripts/project-layout.md.
needs_host:
  - name: traefik
folders:
  - path: blackbox-exporter-config
    owner: 101000
    group: 101000
files:
  - path: blackbox-exporter-config/blackbox.yml
    source: containers/blackbox-exporter/config/blackbox.yml.example
    owner: 101000
    group: 101000
