###############################################################################
# Start of stack config
###############################################################################
# Project Name: "traefik"
name: ${PROJECT_NAME}

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
  frontend:
    name: ${PROJECT_NAME}_frontend
    internal: false
  backend:
    name: ${PROJECT_NAME}_backend
    internal: true
  socket_proxy:
    name: ${PROJECT_NAME}_socket_proxy
    internal: true

include:
  - ../traefik-agent/compose.yaml

services:

  redis:
    extends:
      file: ../../containers/redis/compose.yaml
      service: .redis-replica

  # Phase 4: outbound-only Cloudflare Tunnel connector — the only way into this VM
  # from the internet. See containers/cloudflared/stack-README.md for the one-time
  # tunnel-creation steps this depends on before it'll actually connect.
  cloudflared:
    extends:
      file: ../../containers/cloudflared/compose.yaml
      service: .cloudflared
