# Generated by scripts/build.py from each container's setup.yaml. Do not edit.
# The ansible stacks role applies this file. See scripts/project-layout.md.
project: "core"
containers: ["blackbox-exporter", "mailpit", "mailrise", "ntfy", "postfix", "uptime-kuma"]
needs_host: ["traefik"]
needs_fleet: []
provides: []
folders:
  - root: "volumes"
    path: "ntfy-data"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "mailrise-secrets"
    owner: 101000
    group: 101000
    mode: "0700"
  - root: "volumes"
    path: "postfix-data"
    owner: 100000
    group: 100000
  - root: "volumes"
    path: "mailpit-data"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "blackbox-exporter-config"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "uptime-kuma-data"
    owner: 101000
    group: 101000
files:
  - path: "mailrise-secrets/mailrise.conf"
    source: "containers/mailrise/config/mailrise.conf.example"
    owner: 101000
    group: 101000
    mode: "0600"
  - path: "blackbox-exporter-config/blackbox.yml"
    source: "containers/blackbox-exporter/config/blackbox.yml.example"
    owner: 101000
    group: 101000
firewall:
  - port: 8025
    proto: "tcp"
    allow_from: "internal"
    comment: "Mailrise SMTP"
  - port: 25
    proto: "tcp"
    allow_from: "internal"
    comment: "Postfix SMTP"
