# Generated by scripts/build.py from each container's setup.yaml. Do not edit.
# The ansible stacks role applies this file. See scripts/project-layout.md.
project: "victoriametrics"
containers: ["alertmanager", "cadvisor", "grafana", "socket-proxy", "vector", "victorialogs", "victoriametrics", "victoriatraces", "vlagent", "vmagent", "vmalert", "vmauth"]
needs_host: ["traefik"]
needs_fleet: []
provides:
  - name: "vmauth"
    reach: "fleet"
folders:
