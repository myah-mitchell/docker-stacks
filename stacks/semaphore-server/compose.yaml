###############################################################################
# Start of stack config
###############################################################################
# Project Name: "semaphore"
name: ${PROJECT_NAME}

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
  frontend:
    name: ${PROJECT_NAME}_frontend
    internal: false
  backend:
    name: ${PROJECT_NAME}_backend
    internal: true

services:

  semaphore:
    extends:
      file: ../../containers/semaphore/compose.yaml
      service: .semaphore

  postgres:
    extends:
      file: ../../containers/postgres/compose.yaml
      service: .postgres
    environment:
      TOFU_STATE_POSTGRES_PASSWORD: ${TOFU_STATE_POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_VOLUMES}/${PROJECT_NAME}/postgres-initdb:/docker-entrypoint-initdb.d:ro

  nix:
    extends:
      file: ../../containers/nix/compose.yaml
      service: .nix

  postgres-backup:
    extends:
      file: ../../containers/postgres-backup/compose.yaml
      service: .postgres-backup
    environment:
      # tofu_state is the OpenTofu state database, created on first start by
      # postgres-initdb/10-tofu-state.sh. See
      # https://myah-mitchell.github.io/docs/fleet-bootstrap/foundation/handover/#state-database
      POSTGRES_BACKUP_DB: ${POSTGRES_DB},tofu_state
      POSTGRES_BACKUP_USER: ${POSTGRES_USER}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_PASSWORD}
