###############################################################################
#region Default configs
###############################################################################

  #####################################
  # Container base defaults
  #####################################
  # Max Usage Limits
x-limits: &limits
  mem_limit: ${MEM_LIMIT:-2G} # Override per container if necessary
  memswap_limit: ${MEM_SWAP_LIMIT:-2.5G}
  mem_reservation: ${MEM_RESERVATION:-64M}
  pids_limit: ${PIDS_LIMIT:-200}
  cpus: ${CPUS_LIMIT:-2} # Set below the total number of cores, for example 3.5 for 4 cores

  # Restart Settings
x-restart: &restart
  stop_grace_period: ${RESTART_GRACE:-1m}
  restart: ${RESTART_MODE:-unless-stopped}

  # Configure security
x-security: &security
  security_opt:
    - no-new-privileges=${NO_NEW_PRIVILEGES:-true}

  # Configure User
x-user: &user
  user: ${PUID:-1000}:${PGID:-1000}

  # Configure Logging
x-logging: &logging
  logging:
    options:
      max-size: ${LOG_MAX_SIZE:-10m}
      max-file: ${LOG_MAX_FILE:-3}

  ## All base defaults in one
x-base: &default-base
  <<: [*limits, *restart, *security, *user, *logging]

  #####################################
  # Container healthcheck defaults
  #####################################
x-healthcheck: &default_healthcheck
  interval: ${HEALTH_INTERVAL:-60s}
  timeout: ${HEALTH_TIMEOUT:-10s}
  retries: ${HEALTH_RETRIES:-5}
  start_period: ${HEALTH_START:-10s}

  #####################################
  # Container environment defaults
  #####################################
x-environment-tz: &environment_tz
  TZ: ${TZ:-America/Chicago}

x-environment-user: &environment_user
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}

  ## All environment defaults in one
x-environment: &default_environment
  <<: [*environment_tz, *environment_user]

#endregion
###############################################################################
#region Stack config
###############################################################################

services:

  .mailpit:
    <<: [*limits, *restart, *security, *user, *logging]
    image: axllent/mailpit:v1.31.1
    hostname: ${PROJECT_NAME}-${MAILPIT_HOSTNAME}.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}
    container_name: "${PROJECT_NAME}-${MAILPIT_HOSTNAME}"
    # No published port. Postfix delivers to 1025 over the backend network, and
    # the web UI on 8025 goes through Traefik. mailrise already holds 8025 on
    # the host, so publishing it would collide anyway.
    environment:
      <<: [*environment_tz]
      MP_DATABASE: /data/mailpit.db
      # Oldest messages are deleted once either limit is passed.
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
      MP_MAX_AGE: ${MAILPIT_MAX_AGE:-30d}
    volumes:
      - ${DOCKER_VOLUMES}/${PROJECT_NAME}/mailpit-data:/data
    labels: ## Traefik Labels
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK}"
      - "traefik.http.routers.$PROJECT_NAME-mailpit-rtr.rule=
        Host(`${MAILPIT_SERVICE_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}`) ||
        Host(`${MAILPIT_HOSTNAME}.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}`)"
        # Gated behind Authentik by default. The copies include password reset
        # and sign-in links, so this UI is as sensitive as the mailboxes they
        # were sent to. Never publish it through the tunnel.
      - "traefik.http.routers.$PROJECT_NAME-mailpit-rtr.middlewares=${TRAEFIK_AUTH_CHAIN:-chain-authentik@file}"
      - "traefik.http.services.$PROJECT_NAME-mailpit-svc.loadbalancer.server.port=8025"
      ## Komodo Labels
      - "komodo.skip" # Prevent Komodo from stopping with StopAllContainers
    networks:
      - proxy
      - backend
    healthcheck:
      # The image's own check. It asks the running UI whether it is ready.
      test: ["CMD", "/mailpit", "readyz"]
      <<: *default_healthcheck
