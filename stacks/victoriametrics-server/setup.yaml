    path: "vlagent-data"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "vmagent-data"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "vector-data"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "victoriametrics-data"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "victorialogs-data"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "victoriatraces-data"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "grafana-data"
    owner: 101000
    group: 101000
files: []
firewall:
  - port: 5140
    proto: "tcp"
    allow_from: "internal"
    comment: "Vector syslog"
  - port: 5140
    proto: "udp"
    allow_from: "internal"
    comment: "Vector syslog"
