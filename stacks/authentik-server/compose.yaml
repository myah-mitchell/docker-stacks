###############################################################################
# Start of stack config
###############################################################################
# Project Name: "authentik"
name: ${PROJECT_NAME}

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
  frontend:
    name: ${PROJECT_NAME}_frontend
    internal: false
  backend:
    name: ${PROJECT_NAME}_backend
    internal: true
  socket_proxy:
    name: ${PROJECT_NAME}_socket_proxy
    internal: true

services:

  authentik-server:
    extends:
      file: ../../containers/authentik/compose.yaml
      service: .authentik-server

  authentik-worker:
    extends:
      file: ../../containers/authentik/compose.yaml
      service: .authentik-worker

  postgres:
    extends:
      file: ../../containers/postgres/compose.yaml
      service: .postgres

  postgres-backup:
    extends:
      file: ../../containers/postgres-backup/compose.yaml
      service: .postgres-backup
    environment:
      POSTGRES_BACKUP_DB: ${POSTGRES_DB}
      POSTGRES_BACKUP_USER: ${POSTGRES_USER}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    extends:
      file: ../../containers/redis/compose.yaml
      service: .redis
    command: --save 60 1 --loglevel warning

  geoipupdate:
    extends:
      file: ../../containers/geoipupdate/compose.yaml
      service: .geoipupdate

  socket-proxy:
    extends:
      file: ../../containers/socket-proxy/compose.yaml
      service: .socket-proxy
    environment:
      EVENTS: 1 #optional
      IMAGES: 1 #optional
      INFO: 1 #optional
      PING: 1 #optional
      POST: 1 #optional
      VERSION: 1 #optional