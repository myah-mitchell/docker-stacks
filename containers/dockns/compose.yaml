###############################################################################
#region Default configs
###############################################################################

  #####################################
  # Container base defaults
  #####################################
  # Max Usage Limits
x-limits: &limits
  mem_limit: ${MEM_LIMIT:-2G} # Override per container if necessary
  memswap_limit: ${MEM_SWAP_LIMIT:-2.5G}
  mem_reservation: ${MEM_RESERVATION:-64M}
  pids_limit: ${PIDS_LIMIT:-200}
  cpus: ${CPUS_LIMIT:-2} # Set below the total number of cores, for example 3.5 for 4 cores

  # Restart Settings
x-restart: &restart
  stop_grace_period: ${RESTART_GRACE:-1m}
  restart: ${RESTART_MODE:-unless-stopped}

  # Configure security
x-security: &security
  security_opt:
   - no-new-privileges=${NO_NEW_PRIVILEGES:-true}

  # Configure User
x-user: &user
  user: ${PUID:-1000}:${PGID:-1000}

  # Configure Logging
x-logging: &logging
  logging:
    options:
      max-size: ${LOG_MAX_SIZE:-10m}
      max-file: ${LOG_MAX_FILE:-3}

  ## All base defaults in one
x-base: &default-base
  <<: [*limits, *restart, *security, *user, *logging]

  #####################################
  # Container healthcheck defaults
  #####################################
x-healthcheck: &default_healthcheck
  interval: ${HEALTH_INTERVAL:-60s}
  timeout: ${HEALTH_TIMEOUT:-10s}
  retries: ${HEALTH_RETRIES:-5}
  start_period: ${HEALTH_START:-10s}
  
  #####################################
  # Container environment defaults
  #####################################
x-environment-tz: &environment_tz
  TZ: ${TZ:-America/Chicago}

x-environment-user: &environment_user
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}

  ## All environment defaults in one
x-environment: &default_environment
  <<: [*environment_tz, *environment_user]
  
#endregion
###############################################################################
#region Stack config
###############################################################################

services:

  .dockns:
    <<: [*limits, *restart, *security, *logging]
    #image: docker.io/brenekh/dockns:latest
    image: docker.io/myahmitchell/dockns:3.1
    hostname: ${PROJECT_NAME}-${DOCKNS_HOSTNAME}.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}
    container_name: "${PROJECT_NAME}-${DOCKNS_HOSTNAME}"
    environment:
      <<: [*environment_tz, *environment_user]
      DOCKER_HOST: tcp://${PROJECT_NAME}-${SOCKET_PROXY_HOSTNAME}:2375
      DOCKNS_LOG_LEVEL: info
      DOCKNS_DB_FILE: /data/record-db.json
      #DOCKNS_DRY_RUN: "true"
      DOCKNS_RECORD_DEFAULTS_TTL: 300
      DOCKNS_NS_CLOUDFLARE_SERVICE: cloudflare
      DOCKNS_NS_CLOUDFLARE_API_KEY: ${DOCKNS_CF_API_TOKEN}
      DOCKNS_NS_CLOUDFLARE_ACCOUNT_ID: ${DOCKNS_CF_ACCOUNT_ID}
      DOCKNS_NS_CLOUDFLARE_ZONE_IDS: "${DOMAIN_NAME}=${DOCKNS_CF_ZONE_ID}"
      DOCKNS_NS_CLOUDFLARE_RECORD_DEFAULTS_TTL: 300
      DOCKNS_NS_CLOUDFLARE_RECORD_DEFAULTS_A_IP: ${DOCKNS_WAN_IP}

      DOCKNS_NS_TECHNITIUM_SERVICE: technitium
      DOCKNS_NS_TECHNITIUM_API_KEY: ${DOCKNS_TECHNITIUM_API_KEY}
      DOCKNS_NS_TECHNITIUM_HOST: ${DOCKNS_TECHNITIUM_HOST}
      DOCKNS_NS_TECHNITIUM_RECORD_DEFAULTS_TTL: 60
      DOCKNS_NS_TECHNITIUM_RECORD_DEFAULTS_CNAME_TARGET_DOMAIN: ${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}

    volumes:
      - "./config:/config"
      - ${DOCKER_VOLUMES}/${PROJECT_NAME}/dockns-data:/data"
    networks:
      - frontend
      - socket_proxy
    healthcheck:
      test: ["CMD", "", ""]
      <<: *default_healthcheck