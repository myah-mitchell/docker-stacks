###############################################################################
#region Default configs
###############################################################################

  #####################################
  # Container base defaults
  #####################################
  # Max Usage Limits
x-limits: &limits
  mem_limit: ${MEM_LIMIT:-2G} # Override per container if necessary
  memswap_limit: ${MEM_SWAP_LIMIT:-2.5G}
  mem_reservation: ${MEM_RESERVATION:-64M}
  pids_limit: ${PIDS_LIMIT:-200}
  cpus: ${CPUS_LIMIT:-2} # Set below the total number of cores, for example 3.5 for 4 cores

  # Restart Settings
x-restart: &restart
  stop_grace_period: ${RESTART_GRACE:-1m}
  restart: ${RESTART_MODE:-unless-stopped}

  # Configure security
x-security: &security
  security_opt:
    - no-new-privileges=${NO_NEW_PRIVILEGES:-true}

  # Configure User
x-user: &user
  user: ${PUID:-1000}:${PGID:-1000}

  # Configure Logging
x-logging: &logging
  logging:
    options:
      max-size: ${LOG_MAX_SIZE:-10m}
      max-file: ${LOG_MAX_FILE:-3}

  ## All base defaults in one
x-base: &default-base
  <<: [*limits, *restart, *security, *user, *logging]

  #####################################
  # Container healthcheck defaults
  #####################################
x-healthcheck: &default_healthcheck
  interval: ${HEALTH_INTERVAL:-60s}
  timeout: ${HEALTH_TIMEOUT:-10s}
  retries: ${HEALTH_RETRIES:-5}
  start_period: ${HEALTH_START:-10s}

  #####################################
  # Container environment defaults
  #####################################
x-environment-tz: &environment_tz
  TZ: ${TZ:-America/Chicago}

x-environment-user: &environment_user
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}

  ## All environment defaults in one
x-environment: &default_environment
  <<: [*environment_tz, *environment_user]

#endregion
###############################################################################
#region Stack config
###############################################################################

services:
  .traefik: &traefik_service
    <<: [*limits, *restart, *security, *user, *logging]
    image: traefik:latest
    hostname: ${PROJECT_NAME}-${TRAEFIK_HOSTNAME}.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}
    container_name: ${PROJECT_NAME}-${TRAEFIK_HOSTNAME}
    command:
      ################################################################
      # Global configuration
      ################################################################
      - --global.checknewversion=true
      - --global.sendanonymoususage=false

      ################################################################
      # Logs
      ################################################################
      - --log.level=INFO
      - --log.format=json
      - --accesslog.format=json
      - --accesslog.addinternals=false
      - --accesslog.filepath=/etc/traefik/log/access.log
      #- --accesslog.bufferingsize=10
      - --accesslog.fields.defaultmode=keep
      - --accesslog.fields.headers.defaultmode=keep
      - --accesslog.fields.headers.names.Cookie=redact
      - --accesslog.fields.headers.names.Set-Cookie=redact
      - --accesslog.fields.headers.names.Authorization=drop

      ################################################################
      # Metrics
      ################################################################
      - --metrics.prometheus.addrouterslabels=true
      - --metrics.prometheus.buckets=0.1,0.3,1.2,5.0
      - --metrics.prometheus.headerlabels.useragent=User-Agent

      ################################################################
      # API and Dashboard
      ################################################################
      - --api.dashboard=true

      ################################################################
      # Entrypoints
      ################################################################
      # HTTP -> HTTPS Redirect
      - --entrypoints.http.address=:80
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
        # Trusted IPs (Cloudflare + Local)
      - "--entrypoints.http.forwardedheaders.trustedips=\
          173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,\
          127.0.0.1/32,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12"
          # Middlewares
      - "--entrypoints.http.http.middlewares=\
          middlewares-rate-limit@file,\
          middlewares-secure-headers@file"
          #middlewares-bouncer@file

      # HTTPS
      - --entrypoints.https.address=:443
      - --entrypoints.https.asdefault=true
      # tls-opts@file sets sniStrict, which refuses any handshake whose SNI has
      # no matching real certificate. A stack with no cert resolver sets
      # TRAEFIK_TLS_OPTIONS to tls-opts-selfsigned@file instead: the same options
      # with sniStrict off, so the generated default certificate still answers.
      - --entrypoints.https.http.tls.options=${TRAEFIK_TLS_OPTIONS:-tls-opts@file}
      #- --entrypoints.https.http.tls.certresolver=letsencrypt
      #- --entrypoints.https.http.tls.domains[0].main=${DOMAIN_NAME}
      #- --entrypoints.https.http.tls.domains[0].sans=*.${DOMAIN_NAME},*.${SUB_DOMAIN_NAME}${DOMAIN_NAME},*.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}
        # Trusted IPs (Cloudflare + Local)
      - "--entrypoints.https.forwardedheaders.trustedips=\
          173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,\
          127.0.0.1/32,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12"
          # Middlewares
      - "--entrypoints.https.http.middlewares=\
          middlewares-rate-limit@file,\
          middlewares-secure-headers@file,\
          middlewares-compress@file"
          #middlewares-bouncer@file,

      # Dashboard
      - --entrypoints.dashboard.address=:8443
      - --entrypoints.dashboard.http.tls.options=${TRAEFIK_TLS_OPTIONS:-tls-opts@file}
      # Blank TRAEFIK_CERT_RESOLVER leaves this argument's value empty, which
      # Traefik reads as no resolver at all: TLS stays on for the entrypoint and
      # the default certificate answers. Note the single dash, so a key that is
      # present but blank keeps its blank value. The two domains below are only
      # read by a resolver, so they are inert when there is none.
      - --entrypoints.dashboard.http.tls.certresolver=${TRAEFIK_CERT_RESOLVER-letsencrypt}
      - --entrypoints.dashboard.http.tls.domains[0].main=${DOMAIN_NAME}
      - --entrypoints.dashboard.http.tls.domains[0].sans=*.${DOMAIN_NAME},*.${SUB_DOMAIN_NAME}${DOMAIN_NAME},*.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}
          # Trusted IPs (Local)
      - "--entrypoints.dashboard.forwardedheaders.trustedips=\
          127.0.0.1/32,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12"

      ################################################################
      # Healthcheck / Ping
      ################################################################
      - --ping=true

      ################################################################
      # Transports
      ################################################################
      - --serversTransport.insecureSkipVerify=true

      ################################################################
      # Providers
      ################################################################
      # Configuration reload frequency
      - --providers.providersthrottleduration=2s

      # Folder with dynamic configuration
      - --providers.file.directory=/etc/traefik/rules
      - --providers.file.watch=true

      # Docker provider for connecting all apps that are inside of the docker network
      - --providers.docker.watch=true
      - --providers.docker.network=${PROXY_NETWORK}
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=tcp://${PROJECT_NAME}-${SOCKET_PROXY_HOSTNAME}:2375

      ################################################################
      # Plugins
      ################################################################
      #- --experimental.plugins.bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      #- --experimental.plugins.bouncer.version=v1.4.6
      #- --experimental.plugins.bouncer.version=v1.5.0

      ################################################################
      # Certificates Resolvers (ACME)
      ################################################################
      # Defined even when nothing points at it. Traefik only requires a storage
      # location to accept a resolver, and a resolver that no entrypoint and no
      # certificate store names is never asked for a certificate, so a stack with
      # a blank TRAEFIK_CERT_RESOLVER and a blank LE_EMAIL carries it harmlessly.
      - --certificatesresolvers.letsencrypt.acme.email=${LE_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/certs/acme.json
      # Uncomment the following line to use LetsEncrypt Staging
      #- --certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=10
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53

      ################################################################
      # Optional arguments, last on purpose
      ################################################################
      # Traefik stops reading its arguments at the first empty one and silently
      # ignores every argument after it, so anything that can expand to nothing
      # belongs at the end of this list. TRAEFIK_EXTRA_COMMAND falls back to a
      # repeat of --ping=true above rather than to nothing, so that leaving it
      # blank cannot swallow the two Redis arguments behind it.
      - ${TRAEFIK_EXTRA_COMMAND:---ping=true}

      # Redis provider for the routers traefik-kop publishes from other hosts.
      # Both lines disappear unless TRAEFIK_REDIS_ENDPOINTS is set, which only the
      # stacks running a Redis master or replica do.
      - ${TRAEFIK_REDIS_ENDPOINTS:+--providers.redis.endpoints=${TRAEFIK_REDIS_ENDPOINTS}}
      - ${TRAEFIK_REDIS_ENDPOINTS:+--providers.redis.password=${REDIS_PASSWORD}}
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    environment:
      <<: [*environment_tz, *environment_user]
      CF_API_EMAIL: ${CF_API_EMAIL}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      DOMAIN_NAME: ${DOMAIN_NAME}
      AUTHENTIK_HOST: ${AUTHENTIK_HOST}
      #CROWDSEC_LAPI_KEY: ${CROWDSEC_LAPI_KEY}
      #CROWDSEC_LAPI_HOST: ${CROWDSEC_LAPI_HOST}
    volumes:
      - "./rules:/etc/traefik/rules/"
      - "${DOCKER_LOGS}/${PROJECT_NAME}/traefik:/etc/traefik/log/"
      - "${DOCKER_VOLUMES}/${PROJECT_NAME}/traefik-plugins:/plugins-storage/"
      - "${DOCKER_VOLUMES}/${PROJECT_NAME}/traefik-certs:/etc/traefik/certs/"
    labels: ## Traefik Labels
      - "traefik.enable=true"

      ## Traefik Dashboard
      - "traefik.http.routers.traefik.rule=
        Host(`${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}`) ||
        Host(`${TRAEFIK_HOSTNAME}.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}`) ||
        Host(`${PROJECT_NAME}.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}`)"
      - "traefik.http.routers.traefik.entrypoints=dashboard"  # Defined in traefik.yaml
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=${TRAEFIK_AUTH_CHAIN:-chain-authentik@file}"

      ## Default TLS Cert
      # Blank TRAEFIK_CERT_RESOLVER leaves this empty, and an empty resolver name
      # matches no resolver, so Traefik never tries to mint this certificate and
      # falls back to its own self-signed one. The two domain hints below are
      # only read once a resolver claims the store.
      - "traefik.tls.stores.default.defaultGeneratedCert.resolver=${TRAEFIK_CERT_RESOLVER-letsencrypt}"
      - "traefik.tls.stores.default.defaultGeneratedCert.domain.main=$DOMAIN_NAME"
      - "traefik.tls.stores.default.defaultGeneratedCert.domain.sans=*.$DOMAIN_NAME,*.$SUB_DOMAIN_NAME$DOMAIN_NAME,*.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}"

      ## Komodo Labels
      - "komodo.skip" # Prevent Komodo from stopping with StopAllContainers
    networks:
      - proxy
      - frontend
      - backend
      - socket_proxy
    depends_on:
      socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      <<: *default_healthcheck

  # Same service, deployed by traefik-bootstrap. It differs only in the values
  # build.py puts in that stack's komodo.env: self-signed TLS options, no cert
  # resolver, and chain-no-auth@file for the dashboard. See
  # docs/traefik-bootstrap.md.
  .traefik-bootstrap:
    <<: *traefik_service
