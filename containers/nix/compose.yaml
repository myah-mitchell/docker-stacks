###############################################################################
#region Default configs
###############################################################################

  #####################################
  # Container base defaults
  #####################################
  # Max Usage Limits
x-limits: &limits
  mem_limit: ${MEM_LIMIT:-2G} # Override per container if necessary
  memswap_limit: ${MEM_SWAP_LIMIT:-2.5G}
  mem_reservation: ${MEM_RESERVATION:-64M}
  pids_limit: ${PIDS_LIMIT:-200}
  cpus: ${CPUS_LIMIT:-2} # Set below the total number of cores, for example 3.5 for 4 cores

  # Restart Settings
x-restart: &restart
  stop_grace_period: ${RESTART_GRACE:-1m}
  restart: ${RESTART_MODE:-unless-stopped}

  # Configure security
x-security: &security
  security_opt:
    - no-new-privileges=${NO_NEW_PRIVILEGES:-true}

  # Configure User
x-user: &user
  user: ${PUID:-1000}:${PGID:-1000}

  # Configure Logging
x-logging: &logging
  logging:
    options:
      max-size: ${LOG_MAX_SIZE:-10m}
      max-file: ${LOG_MAX_FILE:-3}

  ## All base defaults in one
x-base: &default-base
  <<: [*limits, *restart, *security, *user, *logging]

  #####################################
  # Container healthcheck defaults
  #####################################
x-healthcheck: &default_healthcheck
  interval: ${HEALTH_INTERVAL:-60s}
  timeout: ${HEALTH_TIMEOUT:-10s}
  retries: ${HEALTH_RETRIES:-5}
  start_period: ${HEALTH_START:-10s}

  #####################################
  # Container environment defaults
  #####################################
x-environment-tz: &environment_tz
  TZ: ${TZ:-America/Chicago}

x-environment-user: &environment_user
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}

  ## All environment defaults in one
x-environment: &default_environment
  <<: [*environment_tz, *environment_user]

#endregion
###############################################################################
#region Stack config
###############################################################################

services:

  ## Fills the folder another container mounts at /nix, one time, then exits.
  ## The image's own /nix holds nix and everything nix needs to run, so a copy
  ## of it is a working nix for any image, whatever libc that image has.
  ##
  ## The copy goes to the owner of the folder, which setup.yaml sets to the
  ## user of the container that mounts it. That user then runs nix in
  ## single-user mode, with no daemon. store is moved into place last, so a
  ## folder that has one was filled to the end.
  .nix:
    <<: [*limits, *security, *logging]
    image: nixos/nix:2.35.2
    hostname: ${PROJECT_NAME}-${NIX_HOSTNAME:-nix}.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}
    container_name: "${PROJECT_NAME}-${NIX_HOSTNAME:-nix}"
    restart: "no"
    command:
      - bash
      - -euc
      - |
        cd /nix-data
        if [ -e store ]; then
          echo "/nix-data already holds a store. Left as it is."
          exit 0
        fi
        owner="$$(stat -c %u:%g .)"
        rm -rf .filling var
        cp -a /nix .filling
        chown -hR "$$owner" .filling
        mv .filling/var .filling/store .
        rmdir .filling
        echo "Filled /nix-data from this image, owned by $$owner."
    volumes:
      - ${DOCKER_VOLUMES}/${PROJECT_NAME}/nix-data:/nix-data
    # It opens no connection. backend is the internal network, and build.py
    # checks a needs_stack against the networks the two containers share.
    networks:
      - backend
