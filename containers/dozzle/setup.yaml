# Host setup for dozzle. scripts/build.py renders it into each stack README, and
# nixos-sync.yml carries it to the host's NixOS configuration. See
# scripts/project-layout.md.
needs_stack:
  # The server variant reads agents over the network through
  # DOZZLE_REMOTE_AGENT and touches no local socket.
  - name: socket-proxy
    services: [dozzle, dozzle-agent]
needs_host:
  # The agent variant is reached by the server on its published port, so
  # only the server needs a Traefik in front of it.
  - name: traefik
    services: [dozzle-server]
firewall:
  - port: 7007
    proto: tcp
    allow_from: internal
    comment: Dozzle agent
    services: [dozzle-agent]
