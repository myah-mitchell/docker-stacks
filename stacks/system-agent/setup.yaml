# Generated by scripts/build.py from each container's setup.yaml. Do not edit.
# The ansible stacks role applies this file. See scripts/project-layout.md.
project: "system"
folders:
  - root: "logs"
    path: "traefik"
    owner: 101000
    group: 101000
    mode: "0755"
  - root: "volumes"
    path: "traefik-certs"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "traefik-plugins"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "vmagent-data"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "vlagent-data"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "vector-data"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "dockns-data"
    owner: 100000
    group: 100000
files: []
firewall:
  - port: 80
    proto: "tcp"
    allow_from: "any"
    comment: "Traefik HTTP"
  - port: 443
    proto: "tcp"
    allow_from: "any"
    comment: "Traefik HTTPS"
  - port: 8443
    proto: "tcp"
    allow_from: "any"
    comment: "Traefik HTTPS (alt)"
  - port: 5140
    proto: "tcp"
    allow_from: "internal"
    comment: "Vector syslog"
  - port: 5140
    proto: "udp"
    allow_from: "internal"
    comment: "Vector syslog"
  - port: 7007
    proto: "tcp"
    allow_from: "internal"
    comment: "Dozzle agent"
