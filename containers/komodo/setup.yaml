# Host setup for komodo. scripts/build.py renders it into each stack README, and
# the ansible stacks role applies it. See scripts/project-layout.md.
folders:
  - path: komodo-keys
    owner: 101000
    group: 101000
  - path: komodo-backups
    owner: 101000
    group: 101000
  - path: komodo-sync
    owner: 101000
    group: 101000
  - path: komodo-cache
    owner: 101000
    group: 101000
  - path: komodo-secrets
    owner: 101000
    group: 101000
    mode: "0700"
files:
  - path: komodo-secrets/core.config.toml
    source: containers/komodo/config/core.config.toml.example
    owner: 101000
    group: 101000
    mode: "0600"
firewall:
  - port: 9120
    proto: tcp
    allow_from: any
    comment: Komodo Core
