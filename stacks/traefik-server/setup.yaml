# Generated by scripts/build.py from each container's setup.yaml. Do not edit.
# The ansible stacks role applies this file. See scripts/project-layout.md.
project: "traefik"
containers: ["error-pages", "logrotate", "redis", "socket-proxy", "traefik", "traefik-kop"]
needs_host: []
needs_fleet: []
provides:
  - name: "kop-redis"
    reach: "fleet"
  - name: "traefik"
    reach: "host"
folders:
  - root: "logs"
    path: "traefik"
    owner: 101000
    group: 101000
    mode: "0755"
  - root: "volumes"
    path: "traefik-certs"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "traefik-plugins"
    owner: 101000
    group: 101000
files: []
firewall:
  - port: 80
    proto: "tcp"
    allow_from: "any"
    comment: "Traefik HTTP"
  - port: 443
    proto: "tcp"
    allow_from: "any"
    comment: "Traefik HTTPS"
  - port: 8443
    proto: "tcp"
    allow_from: "any"
    comment: "Traefik HTTPS (alt)"
  - port: 6379
    proto: "tcp"
    allow_from: "internal"
    comment: "traefik-kop Redis"
