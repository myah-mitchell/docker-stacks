# Host setup for stalwart. scripts/build.py renders it into each stack README, and
# nixos-sync.yml carries it to the host's NixOS configuration. See
# scripts/project-layout.md.
needs_host:
  - name: traefik
folders:
  - path: stalwart-config
    owner: 102000
    group: 102000
  - path: stalwart-data
    owner: 102000
    group: 102000
firewall:
  - port: 25
    proto: tcp
    allow_from: any
    comment: Stalwart SMTP
  - port: 465
    proto: tcp
    allow_from: any
    comment: Stalwart submissions
  - port: 587
    proto: tcp
    allow_from: any
    comment: Stalwart submission
  - port: 993
    proto: tcp
    allow_from: any
    comment: Stalwart IMAPS
