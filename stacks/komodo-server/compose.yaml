###############################################################################
# Start of stack config
###############################################################################
# Project Name: "komodo"
name: ${PROJECT_NAME}

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
  frontend:
    name: ${PROJECT_NAME}_frontend
    internal: false
  backend:
    name: ${PROJECT_NAME}_backend
    internal: true
#  socket_proxy:
#    name: ${PROJECT_NAME}_socket_proxy
#    internal: true

services:

  ferretdb:
    extends:
      file: ../../containers/ferretdb/compose.yaml
      service: .ferretdb

  # FerretDB Postgres with DocumentDB Included
  postgres:
    extends:
      file: ../../containers/ferretdb/compose.yaml
      service: .postgres

  postgres-backup:
    extends:
      file: ../../containers/postgres-backup/compose.yaml
      service: .postgres-backup
    environment:
      # FerretDB's postgres always uses a literal "postgres" DB name (see
      # containers/ferretdb/compose.yaml) — not a ${POSTGRES_DB} var like the plain
      # containers/postgres/ pattern used elsewhere, so this is hardcoded here instead.
      POSTGRES_BACKUP_DB: postgres
      POSTGRES_BACKUP_USER: ${POSTGRES_USER}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_PASSWORD}

  komodo:
    extends:
      file: ../../containers/komodo/compose.yaml
      service: .komodo

