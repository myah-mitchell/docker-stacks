# Host setup for semaphore. scripts/build.py renders it into each stack README, and
# nixos-sync.yml carries it to the host's NixOS configuration. See
# scripts/project-layout.md.
needs_stack:
  - name: postgres
  - name: nix
needs_host:
  - name: traefik
folders:
  - path: semaphore-data
    owner: 101001
    group: 101001
  - path: semaphore-config
    owner: 101001
    group: 101001
  - path: semaphore-tmp
    owner: 101001
    group: 101001
  # Mounted at /nix. The nix service fills it and hands it to this owner, and
  # nix refuses a store its own user cannot write to.
  - path: nix-data
    owner: 101001
    group: 101001
  # Read by the postgres image on the first start of an empty data directory,
  # as its postgres user, so the folder and the script must be world readable.
  - path: postgres-initdb
    owner: 100000
    group: 100000
    mode: "0755"
files:
  - path: postgres-initdb/10-tofu-state.sh
    source: containers/semaphore/config/postgres-initdb/10-tofu-state.sh
    owner: 100000
    group: 100000
    mode: "0755"
