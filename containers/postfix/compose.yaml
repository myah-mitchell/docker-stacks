###############################################################################
#region Default configs
###############################################################################

  #####################################
  # Container base defaults
  #####################################
  # Max Usage Limits
x-limits: &limits
  mem_limit: ${MEM_LIMIT:-2G} # Override per container if necessary
  memswap_limit: ${MEM_SWAP_LIMIT:-2.5G}
  mem_reservation: ${MEM_RESERVATION:-64M}
  pids_limit: ${PIDS_LIMIT:-200}
  cpus: ${CPUS_LIMIT:-2} # Set below the total number of cores, for example 3.5 for 4 cores

  # Restart Settings
x-restart: &restart
  stop_grace_period: ${RESTART_GRACE:-1m}
  restart: ${RESTART_MODE:-unless-stopped}

  # Configure security
x-security: &security
  security_opt:
    - no-new-privileges=${NO_NEW_PRIVILEGES:-true}

  # Configure User
x-user: &user
  user: ${PUID:-1000}:${PGID:-1000}

  # Configure Logging
x-logging: &logging
  logging:
    options:
      max-size: ${LOG_MAX_SIZE:-10m}
      max-file: ${LOG_MAX_FILE:-3}

  ## All base defaults in one
x-base: &default-base
  <<: [*limits, *restart, *security, *user, *logging]

  #####################################
  # Container healthcheck defaults
  #####################################
x-healthcheck: &default_healthcheck
  interval: ${HEALTH_INTERVAL:-60s}
  timeout: ${HEALTH_TIMEOUT:-10s}
  retries: ${HEALTH_RETRIES:-5}
  start_period: ${HEALTH_START:-10s}

  #####################################
  # Container environment defaults
  #####################################
x-environment-tz: &environment_tz
  TZ: ${TZ:-America/Chicago}

x-environment-user: &environment_user
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}

  ## All environment defaults in one
x-environment: &default_environment
  <<: [*environment_tz, *environment_user]

#endregion
###############################################################################
#region Stack config
###############################################################################

services:

  .postfix:
    # No *user here. The image's entrypoint runs as root to write main.cf and
    # start supervisord, and Postfix's master process has to start as root so
    # it can drop each daemon to the image's own postfix user.
    <<: [*limits, *restart, *security, *logging]
    image: boky/postfix:v5.1.0
    hostname: ${PROJECT_NAME}-${POSTFIX_HOSTNAME}.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}
    container_name: "${PROJECT_NAME}-${POSTFIX_HOSTNAME}"
    # No Traefik routing. Postfix speaks SMTP, and what sends through it
    # (Authentik, Proxmox, anything else on the LAN) needs a plain host:port.
    ports:
      - "${POSTFIX_SMTP_PORT:-25}:25"
    environment:
      <<: [*environment_tz]
      # Where mail goes next. Blank delivers straight to each recipient's MX.
      RELAYHOST: ${POSTFIX_RELAYHOST:-}
      RELAYHOST_USERNAME: ${POSTFIX_RELAYHOST_USERNAME:-}
      RELAYHOST_PASSWORD: ${POSTFIX_RELAYHOST_PASSWORD:-}
      # The image refuses to start without a sender list. Postfix relays only
      # mail whose From domain is listed here, matched exactly.
      ALLOWED_SENDER_DOMAINS: ${POSTFIX_ALLOWED_SENDER_DOMAINS:-${DOMAIN_NAME}}
      # Copy every message to Mailpit. always_bcc adds a recipient in a domain
      # that cannot exist, and transport_maps sends that domain to Mailpit's
      # SMTP port instead of looking it up, so the copy never leaves the host.
      # The TLS policy stops a stricter relay TLS setting applying to Mailpit.
      # Any other POSTFIX_<name> variable in here becomes a main.cf setting.
      POSTFIX_always_bcc: copy@mailpit.invalid
      POSTFIX_transport_maps: "inline:{ mailpit.invalid=smtp:[mailpit]:1025 }"
      POSTFIX_smtp_tls_policy_maps: "inline:{ [mailpit]:1025=none }"
    volumes:
      # The mail queue, so anything deferred while the relay is down survives
      # a redeploy instead of being dropped.
      - ${DOCKER_VOLUMES}/${PROJECT_NAME}/postfix-data:/var/spool/postfix
    labels:
      ## Komodo Labels
      - "komodo.skip" # Prevent Komodo from stopping with StopAllContainers
    networks:
      # frontend publishes the SMTP port and is the way out to the relay,
      # since backend is internal. backend is how the copies reach Mailpit.
      - frontend
      - backend
    healthcheck:
      # The image's own check: an EHLO on 587, plus OpenDKIM when it is enabled.
      test: ["CMD", "/scripts/healthcheck.sh"]
      <<: *default_healthcheck
