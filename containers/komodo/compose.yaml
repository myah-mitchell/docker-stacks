###############################################################################
#region Default configs
###############################################################################

  #####################################
  # Container base defaults
  #####################################
  # Max Usage Limits
x-limits: &limits
  mem_limit: ${MEM_LIMIT:-2G} # Override per container if necessary
  memswap_limit: ${MEM_SWAP_LIMIT:-2.5G}
  mem_reservation: ${MEM_RESERVATION:-64M}
  pids_limit: ${PIDS_LIMIT:-200}
  cpus: ${CPUS_LIMIT:-2} # Set below the total number of cores, for example 3.5 for 4 cores

  # Restart Settings
x-restart: &restart
  stop_grace_period: ${RESTART_GRACE:-1m}
  restart: ${RESTART_MODE:-unless-stopped}

  # Configure security
x-security: &security
  security_opt:
    - no-new-privileges=${NO_NEW_PRIVILEGES:-true}

  # Configure User
x-user: &user
  user: ${PUID:-1000}:${PGID:-1000}

  # Configure Logging
x-logging: &logging
  logging:
    options:
      max-size: ${LOG_MAX_SIZE:-10m}
      max-file: ${LOG_MAX_FILE:-3}

  ## All base defaults in one
x-base: &default-base
  <<: [*limits, *restart, *security, *user, *logging]

  #####################################
  # Container healthcheck defaults
  #####################################
x-healthcheck: &default_healthcheck
  interval: ${HEALTH_INTERVAL:-60s}
  timeout: ${HEALTH_TIMEOUT:-10s}
  retries: ${HEALTH_RETRIES:-5}
  start_period: ${HEALTH_START:-10s}

  #####################################
  # Container environment defaults
  #####################################
x-environment-tz: &environment_tz
  TZ: ${TZ:-America/Chicago}

x-environment-user: &environment_user
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}

  ## All environment defaults in one
x-environment: &default_environment
  <<: [*environment_tz, *environment_user]

#endregion
###############################################################################
#region Stack config
###############################################################################

services:

  .komodo:
    <<: [*limits, *restart, *security, *user, *logging]
    image: ghcr.io/moghtech/komodo-core:latest
    hostname: ${PROJECT_NAME}-${KOMODO_HOSTNAME}.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}
    container_name: "${PROJECT_NAME}-${KOMODO_HOSTNAME}"
    ports:
      - 9120:9120
    environment:
      <<: [*environment_tz, *environment_user]
      KOMODO_DATABASE_ADDRESS: ${PROJECT_NAME}-${FERRETDB_HOSTNAME}:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
      KOMODO_PASSKEY: ${KOMODO_PASSKEY}
      KOMODO_TITLE: ${KOMODO_TITLE:-Komodo}
      KOMODO_HOST: ${PROJECT_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}
    volumes:
      # core.config.toml (git_provider tokens, core [secrets] used to resolve this
      # repo's [[VAR]] references) holds real credentials once filled in — lives in
      # secrets/, never config/. See containers/komodo/config/core.config.toml.example
      # for the field reference (unmodified upstream default, safe to keep in git).
      - ./secrets/core.config.toml:/config/config.toml:ro
      - ${DOCKER_VOLUMES}/${PROJECT_NAME}/komodo-backups:/backups
      - ${DOCKER_VOLUMES}/${PROJECT_NAME}/komodo-sync:/syncs
      - ${DOCKER_VOLUMES}/${PROJECT_NAME}/komodo-cache:/repo-cache
    labels: ## Traefik Labels
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK}"
        ## HTTP Routers
      - "traefik.http.routers.$PROJECT_NAME-rtr.rule=
        Host(`${KOMODO_HOSTNAME}.${DOMAIN_NAME}`) ||
        Host(`${KOMODO_HOSTNAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}`) ||
        Host(`${KOMODO_HOSTNAME}.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}`) ||
        Host(`${PROJECT_NAME}.${SERVER_NAME}.${SUB_DOMAIN_NAME}${DOMAIN_NAME}`)"
        ## Middlewares
      - "traefik.http.routers.$PROJECT_NAME-rtr.middlewares=chain-no-auth@file"
        ## HTTP Services
      - "traefik.http.services.$PROJECT_NAME-svc.loadbalancer.server.port=9120"
      ## Komodo Labels
      - "komodo.skip" # Prevent Komodo from stopping with StopAllContainers
    networks:
      - proxy
      - frontend
      - backend
    depends_on:
      ferretdb:
        condition: service_healthy
    ## Allows for systemd Periphery connection at
    ## "https://host.docker.internal:8120"
    ##extra_hosts:
    ##  - host.docker.internal:host-gateway
    #healthcheck:
    #  test: ["CMD", "", ""]
    #  <<: *default_healthcheck
