project: "komodo"
folders:
  - root: "volumes"
    path: "ferretdb-data"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "postgres-data"
    owner: 100000
    group: 100000
  - root: "volumes"
    path: "postgres-backup-data"
    owner: 100000
    group: 100000
  - root: "volumes"
    path: "komodo-keys"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "komodo-backups"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "komodo-sync"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "komodo-cache"
    owner: 101000
    group: 101000
  - root: "volumes"
    path: "komodo-secrets"
    owner: 101000
    group: 101000
    mode: "0700"
files:
