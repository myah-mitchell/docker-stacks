# Host setup for cloudflared. scripts/build.py renders it into each stack README, and
# the ansible stacks role applies it. See scripts/project-layout.md.
folders:
  - path: cloudflared-config
    owner: 101000
    group: 101000
  - path: cloudflared-secrets
    owner: 101000
    group: 101000
    mode: "0700"
files:
  - path: cloudflared-config/config.yml
    source: containers/cloudflared/config/config.yml.example
    owner: 101000
    group: 101000
